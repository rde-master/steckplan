appId: io.github.rde-master.steckplan-player
productName: Steckplan Player
executableName: steckplan-player
copyright: Copyright © rde-master – GPL-3.0
artifactName: Steckplan-Player-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - package.json

asar: true
npmRebuild: false
publish: null

mac:
  target:
    - target: dmg
      arch: universal
  category: public.app-category.entertainment
  # Ad-hoc-Signatur: ohne kostenpflichtiges Zertifikat, aber nötig, damit die App auf Apple-Silicon-Macs startet.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  artifactName: Steckplan-Player-${version}-mac-universal.${ext}

win:
  target:
    - target: nsis
      arch: x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Steckplan-Player-${version}-win-setup.${ext}

linux:
  target: dir
