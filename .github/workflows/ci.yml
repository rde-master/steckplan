name: CI

on:
  # main wird nicht extra geprüft: dorthin kommt nur der bereits auf develop getestete Stand (Release)
  push:
    branches: [develop, 'feature/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Typecheck, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versionen konsistent
        run: pnpm version:sync && git diff --exit-code
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke-Test Desktop (Linux, Xvfb)
        run: xvfb-run -a pnpm --filter @steckplan/desktop smoke
      - name: Playwright-Browser installieren
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E-Tests (Browser, Handy, Desktop)
        run: xvfb-run -a pnpm test:e2e
      - name: E2E-Bericht hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  desktop:
    name: Desktop-Installer (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            builder: --mac
            files: apps/desktop/release/*.dmg
          - name: Windows
            os: windows-latest
            builder: --win
            files: apps/desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Smoke-Test Desktop
        run: pnpm --filter @steckplan/desktop smoke
      - name: Playwright-Browser installieren (Handy-Seite im Desktop-Test)
        run: pnpm exec playwright install chromium --only-shell
      - name: E2E-Test Desktop
        run: pnpm exec playwright test --project electron
      - name: Installer bauen
        run: pnpm --filter @steckplan/desktop exec electron-builder ${{ matrix.builder }}
      - uses: actions/upload-artifact@v7
        with:
          name: steckplan-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker-Image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    steps:
      - uses: actions/checkout@v7
      - name: Version lesen
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Anmelden bei GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: apps/docker/Dockerfile
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ghcr.io/rde-master/steckplan:develop
          build-args: VERSION=${{ steps.version.outputs.version }}-develop
          cache-from: type=gha
          cache-to: type=gha,mode=max
