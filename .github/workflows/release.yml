name: Release

# Ausgelöst durch einen Versions-Tag vX.Y.Z auf main (siehe PLAN.md, Abschnitt 11).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    name: Tag prüfen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Tag muss zur Version in package.json passen
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu package.json ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop-Installer (${{ matrix.name }})
    needs: verify
    strategy:
      matrix:
        include:
          - name: macOS
            os: macos-latest
            builder: --mac
            files: |
              apps/desktop/release/*.dmg
              apps/player/release/*.dmg
          - name: Windows
            os: windows-latest
            builder: --win
            files: |
              apps/desktop/release/*.exe
              apps/player/release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Keine Tests hier: der Stand wurde auf develop bereits vollständig geprüft
      - name: Cache Electron-Downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - run: pnpm build
      - name: Electron laden (mit Wiederholung)
        run: node scripts/ci/install-electron.mjs
      - name: Installer bauen (mit Wiederholung)
        run: node scripts/ci/retry.mjs 3 pnpm --filter @steckplan/desktop exec electron-builder ${{ matrix.builder }}
      - name: Installer Player bauen (mit Wiederholung)
        run: node scripts/ci/retry.mjs 3 pnpm --filter @steckplan/player exec electron-builder ${{ matrix.builder }}
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  docker:
    name: Docker-Image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: apps/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rde-master/steckplan:latest
            ghcr.io/rde-master/steckplan:${{ needs.verify.outputs.version }}
          build-args: VERSION=${{ needs.verify.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub-Release
    needs: [verify, desktop, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: installer
          pattern: installer-*
          merge-multiple: true
      - name: Installer vorhanden?
        run: |
          find installer -type f
          test "$(find installer -type f \( -name '*.exe' -o -name '*.dmg' \) | wc -l)" -ge 4
      - name: Release-Notizen aus CHANGELOG
        run: |
          awk -v v="${{ needs.verify.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ---
          **Hinweis:** Die Installer sind nicht kostenpflichtig signiert. macOS (Gatekeeper) und Windows (SmartScreen) zeigen beim ersten Start eine Warnung – siehe README.

          Docker: `docker pull ghcr.io/rde-master/steckplan:${{ needs.verify.outputs.version }}`
          NOTES
      - uses: softprops/action-gh-release@v3
        with:
          name: Steckplan ${{ needs.verify.outputs.version }}
          body_path: notes.md
          # Installer liegen in Unterordnern (desktop/release, player/release)
          fail_on_unmatched_files: true
          files: |
            installer/**/*.exe
            installer/**/*.dmg
