name: Idee / Funktionswunsch
description: Vorschlag für eine neue Funktion oder Verbesserung
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: vorschlag
    attributes:
      label: Vorschlag
  - type: textarea
    id: alternativen
    attributes:
      label: Alternativen / Zusatzinfos
